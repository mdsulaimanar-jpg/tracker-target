name: Bot Anti-Sleep Streamlit

on:
  schedule:
    # Bot bakal jalan otomatis tiap jam 00:00 dan 12:00 UTC (Tiap 12 Jam)
    - cron: '0 0,12 * * *'
  workflow_dispatch: # Biar lu bisa nge-klik tombol 'Run' manual di GitHub nanti

jobs:
  bangunin-web:
    runs-on: ubuntu-latest
    steps:
      - name: Tarik kode dari repository
        uses: actions/checkout@v3

      - name: Siapin Python di Server GitHub
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Playwright (Browser Headless)
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          playwright install chromium

      - name: Jalankan Script Bot
        run: python ping.py
